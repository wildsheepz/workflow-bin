name: Update Binaries

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-binaries:
    runs-on: ubuntu-latest
    strategy: 
      # max-parallel: ${{inputs.max-parallel}}
      matrix:
        run: 
          - { "branch": "betterleaks" }
          - { "branch": "cosign" }
          - { "branch": "grype" }
          - { "branch": "helm" }
          - { "branch": "helmfile" }
          - { "branch": "osv-scanner" }
          - { "branch": "poutine" }
          - { "branch": "slsa-verifier" }
          - { "branch": "yq" }
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.run.branch }}

      - name: Set up Go
        uses: actions/setup-go@v5
        # with:
        #   go-version: '1.21'

      - name: Setup Cosign
        uses: wildsheepz/workflow-bin/setup-cosign@cosign

      - name: Setup SLSA Verifier
        uses: wildsheepz/workflow-bin/setup-slsa-verifier@slsa-verifier

      - name: Download
        env:
          GH_TOKEN: ${{github.token}}
        run: |-
          setup-${{ matrix.run.branch }}/run.sh download

      - name: Verify
        run: |-
          setup-${{ matrix.run.branch }}/run.sh verify

      - name: Store
        run: |-
          setup-${{ matrix.run.branch }}/run.sh store

      - name: Git Actions
        run: |-
          git add setup-${{ matrix.run.branch }}
          git reset setup-${{ matrix.run.branch }}/run.sh
          git status

      - name: Commit and Push Changes
        run: |
          NEW_VERSION=$(jq -r '.tagName' < setup-${{ matrix.run.branch }}/${{ matrix.run.branch }}-HEAD.json)
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --name-only --quiet | grep "$NEW_VERSION.json"; then
            git commit -m "ci: update ${{ matrix.run.branch }} $NEW_VERSION"
            git push
          else
            echo "No changes to commit."
          fi
